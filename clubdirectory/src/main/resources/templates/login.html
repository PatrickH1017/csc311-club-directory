<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sign in – Club Directory</title>
    <style>
        h1 {
            color: green;
        }
        .error {
            color: red;
        }
        .success {
            color: green;
        }
        form div {
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <h1>Sign in</h1>

    <p class="success" th:if="${param.registered}">Account created. Please sign in.</p>
    <p class="error" th:if="${param.error}">Wrong username or password.</p>
    <p class="success" th:if="${param.logout}">You have signed out.</p>

    <form th:action="@{/login}" method="post">
        <div>
            <input type="text" name="username" placeholder="Username">
        </div>
        <div>
            <input type="password" name="password" placeholder="Password">
        </div>
        <button type="submit">Sign in</button>
    </form>

    <p><a th:href="@{/register}">Need an account? Register</a></p>

</body>
</html>
